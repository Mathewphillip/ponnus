<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Ponnus Restaurant</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 480px;">
        <!-- Brand & Chef Logo Header -->
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
                <img src="chef.jpg" alt="Ponnus Chef" class="rounded-circle shadow-sm mb-2 border border-2 border-white" style="width: 70px; height: 70px; object-fit: cover;">
                <h3 class="fw-bold text-dark mb-0" style="letter-spacing: -0.5px;">PONNUS</h3>
                <span class="badge px-3 py-1 text-uppercase fw-semibold" style="background-color: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; font-size: 0.7rem;">
                    Restaurant Menu System
                </span>
            </a>
        </div>

        <!-- Auth Card -->
        <div class="auth-card p-4 p-sm-5">
            <h4 class="fw-bold text-dark mb-1">Create Staff Account</h4>
            <p class="text-muted small mb-4">Register as a team member to manage menus and dishes.</p>

            <!-- Registration Form -->
            <form method="GET" action="login.html">
                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label small fw-semibold text-dark">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" 
                               class="form-control border-start-0 ps-0" 
                               id="name" 
                               name="name" 
                               placeholder="e.g. John Doe" 
                               required 
                               autofocus 
                               autocomplete="name">
                    </div>
                </div>

                <!-- Email Address -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-dark">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" 
                               class="form-control border-start-0 ps-0" 
                               id="email" 
                               name="email" 
                               placeholder="name@ponnus.test" 
                               required 
                               autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-dark">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" 
                               class="form-control border-start-0 border-end-0 ps-0" 
                               id="password" 
                               name="password" 
                               placeholder="At least 8 characters" 
                               required 
                               autocomplete="new-password">
                        <button class="input-group-text bg-light border-start-0 text-muted"
                                type="button"
                                id="togglePassword"
                                title="Show / hide password">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="password_confirmation" class="form-label small fw-semibold text-dark">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-shield-lock"></i>
                        </span>
                        <input type="password" 
                               class="form-control border-start-0 border-end-0 ps-0" 
                               id="password_confirmation" 
                               name="password_confirmation" 
                               placeholder="Re-enter your password" 
                               required 
                               autocomplete="new-password">
                        <button class="input-group-text bg-light border-start-0 text-muted"
                                type="button"
                                id="togglePasswordConfirm"
                                title="Show / hide password">
                            <i class="bi bi-eye" id="togglePasswordConfirmIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-brand py-2 fw-semibold shadow-sm">
                        Create Account <i class="bi bi-person-plus ms-1"></i>
                    </button>
                </div>
            </form>

            <!-- Login Link -->
            <div class="text-center pt-3 border-top">
                <span class="small text-muted">Already have an account?</span>
                <a href="login.html" class="small fw-semibold text-decoration-none ms-1" style="color: var(--primary-color);">
                    Sign in here
                </a>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="index.html" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Homepage
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Reusable toggle helper
        function togglePasswordVisibility(btnId, inputId, iconId) {
            document.getElementById(btnId).addEventListener('click', function () {
                const input = document.getElementById(inputId);
                const icon  = document.getElementById(iconId);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('bi-eye', 'bi-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.replace('bi-eye-slash', 'bi-eye');
                }
            });
        }

        // Wire up both password fields
        togglePasswordVisibility('togglePassword',        'password',              'togglePasswordIcon');
        togglePasswordVisibility('togglePasswordConfirm', 'password_confirmation', 'togglePasswordConfirmIcon');
    </script>
</body>
</html>

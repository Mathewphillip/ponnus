<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Ponnus Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
    <div style="width:100%;max-width:480px;">

        <!-- Brand Header -->
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
                <img src="../public/chef.jpg" alt="Ponnus Chef"
                     class="rounded-circle shadow-sm mb-2 border border-2 border-white"
                     style="width:70px;height:70px;object-fit:cover;">
                <h3 class="fw-bold text-dark mb-0" style="letter-spacing:-0.5px;">PONNUS</h3>
                <span class="badge px-3 py-1 fw-semibold mt-1"
                      style="background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;font-size:0.7rem;">
                    Restaurant Menu System
                </span>
            </a>
        </div>

        <!-- Auth Card -->
        <div class="auth-card wide">
            <h4 class="fw-bold text-dark mb-1">Create Staff Account</h4>
            <p class="text-muted small mb-4">Register as a team member to manage menus and dishes.</p>

            <!-- Success message (shown after demo submit) -->
            <div id="successMsg" class="alert-success-custom mb-3 d-none auto-dismiss">
                <i class="bi bi-check-circle me-1"></i> Account created! Redirecting to login…
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)" novalidate>
                <!-- Full Name -->
                <div class="mb-3">
                    <label for="name" class="form-label small fw-semibold text-dark">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0"
                               id="name" name="name"
                               placeholder="e.g. John Doe"
                               required autofocus autocomplete="name">
                    </div>
                    <div class="invalid-feedback" id="nameErr"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-dark">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 ps-0"
                               id="email" name="email"
                               placeholder="name@ponnus.test"
                               required autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-dark">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0"
                               id="password" name="password"
                               placeholder="At least 8 characters"
                               required autocomplete="new-password">
                        <button class="input-group-text bg-light border-start-0 text-muted"
                                type="button"
                                onclick="togglePwd('password','eye1')"
                                title="Show / hide password">
                            <i class="bi bi-eye" id="eye1"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="password_confirmation" class="form-label small fw-semibold text-dark">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-shield-lock"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0"
                               id="password_confirmation" name="password_confirmation"
                               placeholder="Re-enter your password"
                               required autocomplete="new-password">
                        <button class="input-group-text bg-light border-start-0 text-muted"
                                type="button"
                                onclick="togglePwd('password_confirmation','eye2')"
                                title="Show / hide password">
                            <i class="bi bi-eye" id="eye2"></i>
                        </button>
                    </div>
                    <div class="text-danger small mt-1 d-none" id="pwdMatchErr">Passwords do not match.</div>
                </div>

                <!-- Submit -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-brand py-2 fw-semibold shadow-sm">
                        Create Account <i class="bi bi-person-plus ms-1"></i>
                    </button>
                </div>
            </form>

            <div class="text-center pt-3 border-top">
                <span class="small text-muted">Already have an account?</span>
                <a href="login.html" class="small fw-semibold text-decoration-none ms-1"
                   style="color:var(--primary);">Sign in here</a>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="index.html" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    function handleRegister(e) {
        e.preventDefault();
        const pwd  = document.getElementById('password').value;
        const conf = document.getElementById('password_confirmation').value;
        const err  = document.getElementById('pwdMatchErr');
        if (pwd !== conf) {
            err.classList.remove('d-none');
            return;
        }
        err.classList.add('d-none');
        document.getElementById('successMsg').classList.remove('d-none');
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    }
</script>
</body>
</html>

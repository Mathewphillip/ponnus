<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Ponnus Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
    <div style="width:100%;max-width:440px;">

        <!-- Brand Header -->
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
                <img src="../public/chef.jpg" alt="Ponnus Chef"
                     class="rounded-circle shadow-sm mb-2 border border-2 border-white"
                     style="width:70px;height:70px;object-fit:cover;">
                <h3 class="fw-bold text-dark mb-0" style="letter-spacing:-0.5px;">PONNUS</h3>
                <span class="badge px-3 py-1 fw-semibold mt-1"
                      style="background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;font-size:0.7rem;">
                    Restaurant Menu System
                </span>
            </a>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <h4 class="fw-bold text-dark mb-1">Staff Sign In</h4>
            <p class="text-muted small mb-4">Enter your credentials to access the menu dashboard.</p>

            <!-- Demo error example (hidden by default) -->
            <div id="errorAlert" class="alert-danger-custom mb-3 d-none">
                <i class="bi bi-exclamation-circle me-1"></i>
                These credentials do not match our records.
            </div>

            <form onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-dark">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 ps-0"
                               id="email" name="email"
                               placeholder="name@ponnus.test"
                               required autofocus autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-dark">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0"
                               id="password" name="password"
                               placeholder="••••••••"
                               required autocomplete="current-password">
                        <button class="input-group-text bg-light border-start-0 text-muted"
                                type="button"
                                onclick="togglePwd('password','eyeIcon')"
                                title="Show / hide password">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember_me" name="remember">
                        <label class="form-check-label small text-muted" for="remember_me">Remember me</label>
                    </div>
                </div>

                <!-- Submit -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-brand py-2 fw-semibold shadow-sm">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>

            <!-- Register link -->
            <div class="text-center pt-3 border-top">
                <span class="small text-muted">New staff member?</span>
                <a href="register.html" class="small fw-semibold text-decoration-none ms-1"
                   style="color:var(--primary);">Create an account</a>
            </div>
        </div>

        <!-- Demo credentials -->
        <div class="text-center mt-4">
            <small class="text-muted d-block mb-1">
                Demo Accounts (password: <code>password123</code>)
            </small>
            <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
                <span class="badge bg-light text-muted border" style="cursor:pointer;"
                      onclick="document.getElementById('email').value='admin@ponnus.test'">
                    admin@ponnus.test
                </span>
                <span class="badge bg-light text-muted border" style="cursor:pointer;"
                      onclick="document.getElementById('email').value='staff@ponnus.test'">
                    staff@ponnus.test
                </span>
                <span class="badge bg-light text-muted border" style="cursor:pointer;"
                      onclick="document.getElementById('email').value='manager@ponnus.test'">
                    manager@ponnus.test
                </span>
            </div>
            <a href="index.html" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Homepage
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    // Demo login: valid credentials → dashboard, else show error
    const DEMO_ACCOUNTS = [
        'admin@ponnus.test',
        'staff@ponnus.test',
        'manager@ponnus.test'
    ];
    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pwd   = document.getElementById('password').value;
        const err   = document.getElementById('errorAlert');
        if (DEMO_ACCOUNTS.includes(email) && pwd === 'password123') {
            window.location.href = 'dashboard.html';
        } else {
            err.classList.remove('d-none');
        }
    }
</script>
</body>
</html>

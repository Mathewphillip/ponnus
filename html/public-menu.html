<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu — Ponnus Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ── Navbar ── -->
    <nav class="public-nav">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="text-decoration-none d-flex align-items-center gap-2">
                <img src="../public/chef.jpg" alt="Ponnus Chef"
                     class="rounded-circle shadow-sm" style="width:36px;height:36px;object-fit:cover;">
                <span class="fw-bold fs-5 text-dark" style="letter-spacing:-0.3px;">PONNUS</span>
                <span class="badge bg-light text-muted border small ms-1">Restaurant</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-sm btn-outline-secondary px-3">
                    <i class="bi bi-house me-1"></i> Home
                </a>
                <a href="login.html" class="btn btn-brand btn-sm px-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Staff Login
                </a>
            </div>
        </div>
    </nav>

    <!-- ── Hero ── -->
    <div class="hero-section">
        <div class="container">
            <span class="badge px-3 py-2 rounded-pill mb-3 fw-semibold d-inline-flex align-items-center gap-1"
                  style="background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;">
                <i class="bi bi-egg-fried"></i> Today's Menu
            </span>
            <h1 class="fw-bold mb-2 text-dark" style="font-size:2rem;">What We're Serving</h1>
            <p class="text-secondary mb-0" style="max-width:480px;margin:0 auto;">
                Fresh, locally sourced dishes prepared daily by our kitchen team.
                All prices in Ugandan Shillings.
            </p>
        </div>
    </div>

    <!-- ── Main ── -->
    <main class="py-4">
        <div class="container">

            <!-- Category filter pills -->
            <div class="d-flex flex-wrap gap-2 mb-4 justify-content-center" id="filterRow">
                <span class="filter-pill active" data-cat="All" onclick="filterCategory('All')">All Dishes</span>
                <span class="filter-pill" data-cat="Main Course" onclick="filterCategory('Main Course')">Main Course</span>
                <span class="filter-pill" data-cat="Fast Food" onclick="filterCategory('Fast Food')">Fast Food</span>
                <span class="filter-pill" data-cat="Pizza" onclick="filterCategory('Pizza')">Pizza</span>
                <span class="filter-pill" data-cat="Beverages" onclick="filterCategory('Beverages')">Beverages</span>
            </div>

            <!-- Results count -->
            <div class="text-muted small mb-3 text-center">
                Showing <strong id="dishCount">5</strong> dishes <span id="catLabel"></span>
            </div>

            <!-- Menu grid -->
            <div class="row g-4" id="menuGrid">
                <!-- Cards injected by JS -->
            </div>
        </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="py-3 bg-white border-top text-center text-muted small mt-5">
        <div class="container">
            Ponnus Restaurant &copy; 2026 &mdash;
            <a href="index.html" class="text-decoration-none" style="color:var(--primary);">Home</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        const MENU = [
            { id:1, name:'Chicken Pilau',   category:'Main Course', price:15000, availability:'Available',   description:'Fragrant spiced basmati rice cooked with tender chicken, tomatoes, and aromatic pilau spices.' },
            { id:2, name:'Beef Burger',     category:'Fast Food',   price:18000, availability:'Available',   description:'Juicy flame-grilled beef patty served in a toasted sesame bun with crisp lettuce and tomato.' },
            { id:3, name:'Vegetable Pizza', category:'Pizza',       price:25000, availability:'Available',   description:'Crispy thin-crust artisan pizza topped with rich tomato sauce, mozzarella, bell peppers, and mushrooms.' },
            { id:4, name:'Fresh Juice',     category:'Beverages',   price:5000,  availability:'Available',   description:'Freshly extracted chilled seasonal passion fruit and orange juice with mint.' },
            { id:5, name:'Grilled Chicken', category:'Main Course', price:28000, availability:'Unavailable', description:'Half chicken slow-marinated in garlic, lemon, and fine herbs, char-grilled to juicy tenderness.' },
        ];

        const catStyles = {
            'Main Course': { bg:'#eff6ff', text:'#1d4ed8', border:'#bfdbfe' },
            'Fast Food':   { bg:'#fefce8', text:'#854d0e', border:'#fde68a' },
            'Pizza':       { bg:'#fdf4ff', text:'#7e22ce', border:'#e9d5ff' },
            'Beverages':   { bg:'#f0fdf4', text:'#166534', border:'#bbf7d0' },
        };

        function renderGrid() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = MENU.map(item => {
                const c = catStyles[item.category] || { bg:'#f8fafc', text:'#475569', border:'#e2e8f0' };
                const avail = item.availability === 'Available';
                return `
                <div class="col-sm-6 col-lg-4">
                    <div class="menu-card menu-item-card" data-category="${item.category}">
                        <!-- Category + Status -->
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span style="font-size:0.72rem;font-weight:600;padding:0.3rem 0.65rem;border-radius:50px;
                                         background:${c.bg};color:${c.text};border:1px solid ${c.border};">
                                ${item.category}
                            </span>
                            ${avail
                                ? `<span class="badge badge-available small" style="border-radius:50px;">
                                       <i class="bi bi-check-circle me-1"></i>Available
                                   </span>`
                                : `<span class="badge badge-unavailable small" style="border-radius:50px;">
                                       <i class="bi bi-x-circle me-1"></i>Unavailable
                                   </span>`
                            }
                        </div>
                        <!-- Name -->
                        <h5 class="fw-bold text-dark mb-2" style="font-size:1rem;">${item.name}</h5>
                        <!-- Description -->
                        <p class="text-secondary mb-3 flex-grow-1" style="font-size:0.85rem;line-height:1.55;">
                            ${item.description}
                        </p>
                        <!-- Price + CTA -->
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-auto">
                            <span class="price-tag">UGX ${item.price.toLocaleString()}</span>
                            ${avail
                                ? `<span class="badge px-3 py-2 rounded-pill fw-semibold"
                                         style="background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;font-size:0.72rem;">
                                       <i class="bi bi-bag-check me-1"></i>Order Now
                                   </span>`
                                : `<span class="text-muted small">Not available today</span>`
                            }
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        renderGrid();
    </script>
</body>
</html>
